# This workflow will install Python dependencies, run tests and lint with ruff on a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
  pull_request:

permissions:
  contents: read


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        ruff check . --select E9,F63,F7,F82 --output-format=github
        # everything else is reported as warnings, as flake8 did before the switch
        ruff check . --exit-zero --output-format=github
        ruff format --check . || true
    - name: Test with pytest
      run: |
        pytest

  check-file-names:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check snake_case file names
      run: |
        status=0
        for f in $(git ls-files 'backend/*.py'); do
          name=$(basename "$f")
          case "$name" in
            __init__.py) continue ;;
          esac
          if [[ ! "$name" =~ ^[a-z][a-z0-9]*(_[a-z0-9]+)*\.py$ ]]; then
            echo "Use snake_case for file names: $f"; status=1
          fi
        done
        exit $status
